name: ULTRAVPN PLAYER Android release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Update manifest tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_create_update_manifest.py'
      - name: Unit and widget tests
        run: flutter test

  android-compile:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile Android app
        run: flutter build apk --debug

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Select signing for the testing APK
        env:
          ANDROID_SIGNING_JSON: ${{ secrets.ANDROID_SIGNING }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$ANDROID_SIGNING_JSON" ]; then
            python3 scripts/configure_android_signing.py
            echo "SIGNING_MODE=permanent" >> "$GITHUB_ENV"
          else
            echo "Using the Android testing key; permanent signing is not configured."
            echo "SIGNING_MODE=testing" >> "$GITHUB_ENV"
          fi
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build signed APK
        run: flutter build apk --release
      - name: Verify signing certificate and name APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk build/ultravpn-player.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs build/ultravpn-player.apk | tee build/signature.txt
          if [ "$SIGNING_MODE" = "permanent" ]; then
            expected="$(tr -d '[:space:]:' < android/release-certificate.sha256 | tr '[:upper:]' '[:lower:]')"
            actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' build/signature.txt | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
            test -n "$expected" && test "$expected" = "$actual"
          fi
          (cd build && sha256sum ultravpn-player.apk > ultravpn-player.apk.sha256)
      - name: Generate verified update manifest
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r' | cut -d+ -f1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          notes="docs/RELEASE_NOTES_$version.md"
          if [ ! -f "$notes" ]; then
            notes="build/update-notes.md"
            printf 'Improvements and fixes for ULTRAVPN PLAYER.\n' > "$notes"
          fi
          python3 scripts/create_update_manifest.py --apk build/ultravpn-player.apk --aapt "$aapt" \
            --apk-url "https://github.com/${{ github.repository }}/releases/download/v$version/ultravpn-player.apk" \
            --notes "$notes" --output build/update.json
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ultravpn-player-apk
          path: |
            build/ultravpn-player.apk
            build/ultravpn-player.apk.sha256
            build/update.json
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r' | cut -d+ -f1)"
          tag="v$version"
          assets=(build/ultravpn-player.apk build/ultravpn-player.apk.sha256)
          if [ "$SIGNING_MODE" = "permanent" ]; then assets+=(build/update.json); fi
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Version $tag already belongs to another commit. Increase the version before releasing."
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            notes="docs/RELEASE_NOTES_$version.md"
            if [ ! -f "$notes" ]; then
              notes="build/release-notes.md"
              printf 'ULTRAVPN PLAYER %s for Android phones and Android TV.\n\nDownload ultravpn-player.apk to install.\n' "$version" > "$notes"
            fi
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "ULTRAVPN PLAYER $version" --notes-file "$notes" --latest
          fi
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/signing/streamline-release.p12
