name: Android test APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build installable test APK
        run: flutter build apk --release
      - name: Name test APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/streamline-test.apk
      - name: Upload APK for sideload testing
        uses: actions/upload-artifact@v4
        with:
          name: streamline-test-apk
          path: build/streamline-test.apk
          if-no-files-found: error
          retention-days: 14
