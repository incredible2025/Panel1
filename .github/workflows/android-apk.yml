name: Ultravpn-player Android release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Release tooling tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Unit and widget tests
        run: flutter test
      - name: Render television previews
        if: always() && github.event_name == 'pull_request'
        run: flutter test --dart-define=CAPTURE_UI=true --dart-define=CAPTURE_UI_ART=true test/ui_test.dart --plain-name "TV redesign visual"
      - name: Upload television previews
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: television-previews
          path: build/qa/tv-redesign-*.png
          if-no-files-found: ignore
          retention-days: 7

  android-compile:
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Compile Android app
        run: flutter build apk --debug

  release:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Configure permanent release signing
        env:
          ANDROID_SIGNING_JSON: ${{ secrets.ANDROID_SIGNING }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/configure_android_signing.py
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build signed APK
        run: flutter build apk --release
      - name: Verify signing certificate and name APK
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk build/ultravpn-player.apk
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$apksigner" verify --verbose --print-certs build/ultravpn-player.apk | tee build/signature.txt
          python3 scripts/verify_signing_certificate.py build/signature.txt android/release-certificate.sha256
          cp build/ultravpn-player.apk build/Ultravpn-player.apk
          (cd build && sha256sum Ultravpn-player.apk > Ultravpn-player.apk.sha256)
      - name: Generate portable remote update package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r' | cut -d+ -f1)"
          aapt="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          notes="docs/RELEASE_NOTES_$version.md"
          if [ ! -f "$notes" ]; then
            notes="build/update-notes.md"
            printf 'Improvements and fixes for Ultravpn-player.\n' > "$notes"
          fi
          mkdir -p build/remote-update
          apk="ultravpn-player-$version.apk"
          cp build/Ultravpn-player.apk "build/remote-update/$apk"
          cp build/Ultravpn-player.apk build/remote-update/Ultravpn-player.apk
          python3 scripts/create_update_manifest.py --apk "build/remote-update/$apk" --aapt "$aapt" \
            --apk-url "$apk" --notes "$notes" --output build/remote-update/update.json
          (cd build/remote-update && zip -q ../remote-update.zip update.json "$apk" Ultravpn-player.apk)
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ultravpn-player-apk
          path: |
            build/Ultravpn-player.apk
            build/Ultravpn-player.apk.sha256
            build/remote-update.zip
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: *//p' pubspec.yaml | tr -d '\r' | cut -d+ -f1)"
          tag="v$version"
          assets=(build/Ultravpn-player.apk build/Ultravpn-player.apk.sha256 build/remote-update.zip)
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::Version $tag already belongs to another commit. Increase the version before releasing."
              exit 1
            fi
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            notes="docs/RELEASE_NOTES_$version.md"
            if [ ! -f "$notes" ]; then
              notes="build/release-notes.md"
              printf 'Ultravpn-player %s for Android phones and Android TV.\n\nDownload Ultravpn-player.apk to install.\n' "$version" > "$notes"
            fi
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "Ultravpn-player $version" --notes-file "$notes" --latest
          fi
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/signing/streamline-release.p12
