name: app-manager
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: app-manager:local
    restart: unless-stopped
    env_file: .env
    environment:
      MANAGEMENT_UPLOAD_INBOX: /app/upload-inbox
      MANAGEMENT_RELEASE_RECEIPTS: /app/release-receipts
    volumes:
      - ../data/storage:/app/storage
      - ../data/cache:/app/bootstrap/cache
      - ../data/database:/app/database-state
      - ../upload-inbox:/app/upload-inbox
      - ../release-receipts:/app/release-receipts:ro
    networks:
      default:
        aliases: [app-manager-app]
    security_opt: [no-new-privileges:true]
  web:
    image: nginx:1.28-alpine
    restart: unless-stopped
    volumes:
      - ../public:/app/public:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      default: {}
      edge:
        aliases: [app-manager-web]
    depends_on: [app]
    security_opt: [no-new-privileges:true]
networks:
  edge:
    external: true
    name: ${EDGE_NETWORK:-streamcore_edge}
