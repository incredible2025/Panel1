server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 128k;
    root /app/public;
    location = /app-manager { return 308 /app-manager/; }
    location ~ ^/app-manager/apps/[0-9]+/uploads$ {
        client_max_body_size 410m;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /app-manager/index.php;
        fastcgi_param PHP_SELF /app-manager/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass app-manager-app:9000;
    }
    # Anonymous reporting requests must not create per-device access-log records.
    location ~ "^/app-manager/api/v1/apps/[a-z][a-z0-9-]{2,63}/(?:activity|pair|updates)$" {
        access_log off;
        client_max_body_size 4k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /app-manager/index.php;
        fastcgi_param PHP_SELF /app-manager/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass app-manager-app:9000;
    }
    location ~ ^/app-manager/(?:\.|storage/|vendor/|.*\.php(?:/|$)) { return 404; }
    location /app-manager/ {
        alias /app/public/;
        try_files $uri @portal;
    }
    location @portal {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public/index.php;
        fastcgi_param SCRIPT_NAME /app-manager/index.php;
        fastcgi_param PHP_SELF /app-manager/index.php;
        fastcgi_param DOCUMENT_ROOT /app/public;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_pass app-manager-app:9000;
    }
    location / { return 404; }
}
