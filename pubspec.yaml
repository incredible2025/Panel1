name: streamline_iptv
description: A dual-mode Xtream Codes player for Android phones and Android TV.
publish_to: none
version: 0.6.5+13
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  http: ^1.5.0
  sqflite: ^2.4.2
  path: ^1.9.1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  video_player: 2.10.1
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
dependency_overrides:
  video_player_android:
    path: packages/video_player_android
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
  video_player_platform_interface: ^6.7.0
flutter:
  uses-material-design: true
  assets:
    - assets/licenses/native-player.txt
    - assets/branding/
  fonts:
    - family: Streamline Sans
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: Streamline Display
      fonts:
        - asset: assets/fonts/RobotoCondensed-Regular.ttf
        - asset: assets/fonts/RobotoCondensed-Bold.ttf
          weight: 700
