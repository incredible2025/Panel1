name: streamline_iptv
description: A dual-mode Xtream Codes player for Android phones and Android TV.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  http: ^1.5.0
  sqflite: ^2.4.2
  path: ^1.9.1
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  video_player: ^2.10.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.6
  video_player_platform_interface: ^6.7.0
flutter:
  uses-material-design: true
